[package]
name = "lunmi-setup"
version = "0.1.0"
edition = "2021"
publish = false
description = "Instalador da Lunmi"

[dependencies]
tao = "0.37"
wry = "0.56"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
