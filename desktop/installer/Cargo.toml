[package]
name = "lunmi-setup"
version = "0.1.0"
edition = "2021"
publish = false
description = "Instalador, lançador e atualizador da Lunmi"

[[bin]]
name = "Lunmi"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.56"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
