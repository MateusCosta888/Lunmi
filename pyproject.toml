[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["app", "benchmarks", "benchmark_report.py", "install_ufo.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["F"]
